<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock,paper or Scissor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main-container">
      <div id="scoreboard">
        <div id="human-scoreboard">
          <span>Human</span>
          <div class="score" id="human-score">0</div>
        </div>
        <div id="divider">X</div>
        <div id="computer-scoreboard">
          <span>Computer</span>
          <div class="score" id="computer-score">0</div>
        </div>
      </div>

      <div class="option-container">
        <button>
          <img
            id="paper"
            src="./assets/img/paper.png"
            alt="A image of a hand signing paper"
          />
        </button>
        <button>
          <img
            src="./assets/img/rock.png"
            alt="A image of a hand signing rock"
            id="rock"
          />
        </button>
        <button id="scissor">
          <img
            src="./assets/img/scissor.png"
            alt="A image of a hand signing scissor"
            id="scissor"
          />
        </button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
